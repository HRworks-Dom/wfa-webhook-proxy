<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WFA Webhook Proxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f8f9fa;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 48px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; }
        .error { color: #dc3545; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #e9ecef;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner"></div>
        <h1>Wird verarbeitet…</h1>
        <p>Webhook wird ausgelöst.</p>
    </div>

    <script>
        (async () => {
            // Parse parameters from query string or hash fragment (hash takes priority)
            let params;
            if (window.location.hash && window.location.hash.length > 1) {
                params = new URLSearchParams(window.location.hash.substring(1));
            } else {
                params = new URLSearchParams(window.location.search);
            }

            const webhookUrl = params.get('url');
            const payload = params.get('payload') || '{}';
            const card = document.getElementById('card');

            if (!webhookUrl) {
                card.innerHTML = `
                    <div class="icon">⚠️</div>
                    <h1>Fehler</h1>
                    <p class="error">Kein Webhook-URL Parameter gefunden.<br><code>?url=...</code> oder <code>#url=...</code> fehlt.</p>
                `;
                return;
            }

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: payload
                });

                if (response.ok) {
                    card.innerHTML = `
                        <div class="icon">✅</div>
                        <h1>Erledigt!</h1>
                        <p>Aktion wurde erfolgreich ausgeführt.<br>Du kannst dieses Fenster schließen.</p>
                    `;
                } else {
                    const text = await response.text();
                    card.innerHTML = `
                        <div class="icon">❌</div>
                        <h1>Fehler (${response.status})</h1>
                        <p class="error">${text || 'Webhook hat einen Fehler zurückgegeben.'}</p>
                    `;
                }
            } catch (err) {
                card.innerHTML = `
                    <div class="icon">❌</div>
                    <h1>Verbindungsfehler</h1>
                    <p class="error">${err.message}</p>
                `;
            }
        })();
    </script>
</body>
</html>
